<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ניהול מסכים</title>
<style>
  :root {
    --bg: #f5f3ee; --card: #fff; --text: #1f2430; --muted: #6b7180; --line: #e2ded4;
    --accent: #1d3b78; --accent-soft: #e7ecf7; --danger: #b3261e; --ok: #1b7f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1d212a; --text: #e9e7e1; --muted: #9aa0ad; --line: #2e3340;
            --accent: #8fb0f0; --accent-soft: #23304a; --danger: #ff8a80; --ok: #7fd49a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, 'Segoe UI', Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  .ltr { direction: ltr; text-align: left; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  button {
    font: inherit; border: 1px solid var(--accent); background: var(--accent); color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #10131a; } }
  button.ghost { background: transparent; color: var(--accent); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .screen { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 12px 0; border-top: 1px solid var(--line); }
  .screen:first-of-type { border-top: 0; }
  .screen .name { font-weight: 600; font-size: 17px; }
  .screen .links { font-size: 14px; color: var(--muted); }
  .screen .links a { color: var(--accent); direction: ltr; unicode-bidi: isolate; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .msg.ok { display: block; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .msg.err { display: block; background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 4px 12px; }
  .checks label { color: var(--text); font-size: 15px; display: flex; gap: 6px; align-items: center; margin: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { background: transparent; color: var(--accent); }
  .tabs button.on { background: var(--accent-soft); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ניהול מסכים</h1>
  <p class="sub">יצירת מסכים, שינוי שם וכתובת, והודעות. בהמשך זה יעבור גם ללשונית "מסכים" ב-CRM.</p>
  <div id="msg" class="msg"></div>

  <!-- כניסה -->
  <section class="card" id="login">
    <h2>כניסה</h2>
    <label for="key">מפתח ניהול (ADMIN_KEY)</label>
    <div class="actions">
      <input type="password" id="key" class="ltr" style="max-width:340px" autocomplete="current-password">
      <button id="loginBtn">כניסה</button>
    </div>
    <p class="hint">המפתח שהגדרת ב-Cloudflare. הוא נשמר רק בדפדפן הזה.</p>
  </section>

  <div id="main" hidden>
    <!-- רשימת מסכים -->
    <section class="card">
      <div class="actions" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">המסכים</h2>
        <button class="ghost" id="logoutBtn">יציאה</button>
      </div>
      <div id="screens"></div>
    </section>

    <!-- מסך חדש -->
    <section class="card">
      <h2>מסך חדש</h2>
      <div class="row">
        <div><label for="newName">שם המסך</label><input type="text" id="newName" placeholder="לדוגמה: עזרת נשים"></div>
        <div><label for="newSlug">כתובת (באנגלית)</label><input type="text" id="newSlug" class="ltr" placeholder="ezrat-nashim"></div>
      </div>
      <button id="createBtn">יצירת מסך</button>
      <p class="hint">את השם והכתובת אפשר לשנות בכל זמן. לכל מסך יש גם מזהה קבוע שלא משתנה — אותו כדאי לשים במחשב שמציג.</p>
    </section>

    <!-- עריכת מסך -->
    <section class="card" id="editor" hidden>
      <h2 id="edTitle">עריכת מסך</h2>
      <div class="row">
        <div><label for="edName">שם המסך</label><input type="text" id="edName"></div>
        <div><label for="edSlug">כתובת (באנגלית)</label><input type="text" id="edSlug" class="ltr"></div>
      </div>
      <div class="row">
        <div><label for="edHead">כותרת על המסך</label><input type="text" id="edHead"></div>
        <div><label for="edSub">שורת משנה</label><input type="text" id="edSub"></div>
      </div>
      <div class="row">
        <div><label for="edOrient">כיוון המסך</label>
          <select id="edOrient"><option value="auto">אוטומטי (לפי המסך)</option><option value="landscape">שוכב (רחב)</option><option value="portrait">עומד (גבוה)</option></select></div>
        <div><label for="edTheme">עיצוב</label>
          <select id="edTheme"><option value="navy">כחול-זהב</option><option value="cream">שמנת</option><option value="burgundy">בורדו</option></select></div>
        <div><label for="edH12">תצוגת שעה</label>
          <select id="edH12"><option value="1">6:10 (12 שעות)</option><option value="0">18:10 (24 שעות)</option></select></div>
        <div><label for="edSec">שניות בשעון</label>
          <select id="edSec"><option value="1">להציג</option><option value="0">בלי</option></select></div>
      </div>
      <div class="row">
        <div><label for="edSlide">שניות לכל שקופית</label><input type="number" id="edSlide" min="3" max="300"></div>
        <div><label for="edCandle">הדלקת נרות (דק' לפני השקיעה)</label><input type="number" id="edCandle" min="0" max="90"></div>
        <div><label for="edHavdala">צאת שבת (דק' אחרי השקיעה)</label><input type="number" id="edHavdala" min="0" max="120"></div>
        <div><label for="edTzeit">צאת הכוכבים (דק' אחרי השקיעה)</label><input type="number" id="edTzeit" min="0" max="120"></div>
      </div>
      <label>זמני היום שיוצגו</label>
      <div class="checks" id="edZmanim" style="margin-bottom:16px"></div>
      <div class="actions">
        <button id="saveBtn">שמירה</button>
        <button class="ghost" id="closeBtn">סגירה</button>
        <span style="flex:1"></span>
        <button class="danger" id="deleteBtn">מחיקת המסך</button>
      </div>
    </section>

    <!-- תוכן -->
    <section class="card">
      <h2>תוכן על המסכים</h2>
      <div class="row">
        <div><label for="scope">למי</label><select id="scope"></select></div>
      </div>
      <div class="tabs" id="ctabs">
        <button data-k="announcements" class="on">הודעות</button>
        <button data-k="donors">תורמים</button>
        <button data-k="parnes">פרנס היום</button>
        <button data-k="tefilot">זמני תפילה</button>
      </div>
      <label for="ctext" id="clabel"></label>
      <textarea id="ctext"></textarea>
      <p class="hint" id="chint"></p>
      <div class="row" id="ctitleRow" hidden>
        <div><label for="ctitle">כותרת</label><input type="text" id="ctitle"></div>
      </div>
      <div class="actions">
        <button id="csave">שמירת התוכן</button>
        <button class="ghost" id="cclear">ניקוי (חזרה לכללי / לדוגמה)</button>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let KEY = '';
  try { KEY = localStorage.getItem('adminKey') || ''; } catch {}
  let meta = null, screens = [], editing = null, ctab = 'announcements', contentCache = {};

  function flash(text, ok = true) {
    const m = $('msg');
    m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err');
    clearTimeout(flash.t); flash.t = setTimeout(() => { m.className = 'msg'; }, 5000);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function api(method, path, body) {
    const r = await fetch('/api/admin/' + path, {
      method, headers: { 'authorization': 'Bearer ' + KEY, 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok || !j || !j.ok) {
      const e = new Error((j && j.error) || ('שגיאה ' + r.status)); e.status = r.status; throw e;
    }
    return j;
  }

  async function start() {
    try {
      meta = await api('GET', 'meta');
      $('login').hidden = true; $('main').hidden = false;
      await refresh();
    } catch (e) {
      $('login').hidden = false; $('main').hidden = true;
      if (KEY) flash(e.message, false);
    }
  }

  async function refresh() {
    screens = (await api('GET', 'screens')).screens;
    const origin = location.origin;
    $('screens').innerHTML = screens.length ? screens.map((s) => `
      <div class="screen">
        <div>
          <div class="name">${esc(s.name)}</div>
          <div class="links">כתובת: <a href="/${esc(s.slug)}" target="_blank">${esc(origin)}/${esc(s.slug)}</a><br>
          קבוע (למחשב): <a href="/${esc(s.id)}" target="_blank">${esc(origin)}/${esc(s.id)}</a></div>
        </div>
        <div class="actions"><button class="ghost" data-edit="${esc(s.id)}">עריכה</button></div>
      </div>`).join('') : '<p class="hint">עוד אין מסכים. צור את הראשון למטה.</p>';
    const cur = $('scope').value || 'global';
    $('scope').innerHTML = '<option value="global">כל המסכים</option>' +
      screens.map((s) => `<option value="${esc(s.id)}">רק ל: ${esc(s.name)}</option>`).join('');
    $('scope').value = screens.some((s) => s.id === cur) ? cur : 'global';
    await loadContent();
  }

  // ---------- עריכת מסך ----------
  function openEditor(id) {
    const s = screens.find((x) => x.id === id); if (!s) return;
    editing = s; const st = s.settings;
    $('editor').hidden = false; $('edTitle').textContent = 'עריכת מסך: ' + s.name;
    $('edName').value = s.name; $('edSlug').value = s.slug;
    $('edHead').value = st.title || ''; $('edSub').value = st.subtitle || '';
    $('edOrient').value = st.orientation; $('edTheme').value = st.theme;
    $('edH12').value = st.hour12 === false ? '0' : '1'; $('edSec').value = st.showSeconds === false ? '0' : '1';
    $('edSlide').value = st.slideSeconds; $('edCandle').value = st.candleMinutes;
    $('edHavdala').value = st.havdalahMinutes; $('edTzeit').value = st.tzeitMinutes;
    $('edZmanim').innerHTML = meta.zmanim.map((z) =>
      `<label><input type="checkbox" value="${z.key}" ${st.zmanim.includes(z.key) ? 'checked' : ''}> ${esc(z.label)}</label>`).join('');
    $('editor').scrollIntoView({ behavior: 'smooth' });
  }

  async function saveEditor() {
    if (!editing) return;
    const zmanim = [...$('edZmanim').querySelectorAll('input:checked')].map((x) => x.value);
    try {
      await api('PATCH', 'screens/' + editing.id, {
        name: $('edName').value, slug: $('edSlug').value,
        settings: {
          title: $('edHead').value, subtitle: $('edSub').value,
          orientation: $('edOrient').value, theme: $('edTheme').value,
          hour12: $('edH12').value === '1', showSeconds: $('edSec').value === '1',
          slideSeconds: Number($('edSlide').value), candleMinutes: Number($('edCandle').value),
          havdalahMinutes: Number($('edHavdala').value), tzeitMinutes: Number($('edTzeit').value),
          zmanim,
        },
      });
      flash('נשמר. המסך יתעדכן תוך דקה.');
      await refresh(); openEditor(editing.id);
    } catch (e) { flash(e.message, false); }
  }

  // ---------- תוכן ----------
  const CT = {
    announcements: { label: 'הודעה בכל שורה', hint: 'כל שורה = הודעה (שקופית + פס רץ). אפשר להגביל תאריכים: הטקסט | מתאריך | עד תאריך (למשל: שיעור מיוחד | 2026-11-20 | 2026-11-25)',
      toText: (d) => d.items.map((i) => [i.text, i.from, i.to].filter(Boolean).length > 1 ? `${i.text} | ${i.from || ''} | ${i.to || ''}` : i.text).join('\n'),
      fromText: (t) => t.map((l) => { const [text, from, to] = l.split('|').map((x) => x.trim()); return { text, from: from || undefined, to: to || undefined }; }) },
    donors: { label: 'תורם בכל שורה', hint: 'שם | הערה (ההערה לא חובה). לדוגמה: משפחת כהן | לע"נ אביהם', title: 'תודה לתורמים',
      toText: (d) => d.items.map((i) => i.note ? `${i.name} | ${i.note}` : i.name).join('\n'),
      fromText: (t) => t.map((l) => { const [name, note] = l.split('|').map((x) => x.trim()); return { name, note: note || undefined }; }) },
    parnes: { label: 'פרנס היום', hint: 'שורה בלי תאריך = מוצג כל יום. עם תאריך: 2026-11-18 | ר\' יוסף לוי לרפואת…',
      toText: (d) => d.items.map((i) => i.date ? `${i.date} | ${i.text}` : i.text).join('\n'),
      fromText: (t) => t.map((l) => { const p = l.split('|').map((x) => x.trim()); return /^\d{4}-\d{2}-\d{2}$/.test(p[0]) && p.length > 1 ? { date: p[0], text: p.slice(1).join(' | ') } : { text: l.trim() }; }) },
    tefilot: { label: 'תפילה בכל שורה', hint: 'שם | שעה (24 שעות) — כל יום. עם תאריך: 2026-11-21 | שחרית | 08:00. בהמשך זה יגיע אוטומטית מה-CRM.', title: 'זמני תפילה',
      toText: (d) => d.items.map((i) => [i.date, i.label, i.time].filter(Boolean).join(' | ')).join('\n'),
      fromText: (t) => t.map((l) => { const p = l.split('|').map((x) => x.trim()); return /^\d{4}-\d{2}-\d{2}$/.test(p[0]) ? { date: p[0], label: p[1], time: p[2] } : { label: p[0], time: p[1] }; }) },
  };

  async function loadContent() {
    const scope = $('scope').value || 'global';
    try { contentCache = (await api('GET', 'content/' + encodeURIComponent(scope))).content; }
    catch (e) { contentCache = {}; flash(e.message, false); }
    showTab();
  }

  function showTab() {
    const c = CT[ctab];
    [...$('ctabs').children].forEach((b) => b.classList.toggle('on', b.dataset.k === ctab));
    $('clabel').textContent = c.label; $('chint').textContent = c.hint;
    const cur = contentCache[ctab];
    $('ctext').value = cur ? c.toText(cur.data) : '';
    $('ctitleRow').hidden = !c.title;
    $('ctitle').value = (cur && cur.data.title) || c.title || '';
  }

  async function saveContent() {
    const c = CT[ctab];
    const lines = $('ctext').value.split('\n').map((l) => l.trim()).filter(Boolean);
    const body = { items: c.fromText(lines) };
    if (c.title) body.title = $('ctitle').value;
    try {
      const r = await api('PUT', `content/${encodeURIComponent($('scope').value)}/${ctab}`, body);
      flash(`נשמר (${r.count} שורות). המסכים יתעדכנו תוך דקה.`);
      await loadContent();
    } catch (e) { flash(e.message, false); }
  }

  async function clearContent() {
    if (!confirm('לנקות את התוכן הזה?')) return;
    try { await api('DELETE', `content/${encodeURIComponent($('scope').value)}/${ctab}`); flash('נוקה.'); await loadContent(); }
    catch (e) { flash(e.message, false); }
  }

  // ---------- אירועים ----------
  $('loginBtn').onclick = () => { KEY = $('key').value.trim(); try { localStorage.setItem('adminKey', KEY); } catch {} start(); };
  $('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').onclick = () => { KEY = ''; try { localStorage.removeItem('adminKey'); } catch {} location.reload(); };
  $('screens').onclick = (e) => { const id = e.target.dataset.edit; if (id) openEditor(id); };
  $('createBtn').onclick = async () => {
    try {
      const r = await api('POST', 'screens', { name: $('newName').value, slug: $('newSlug').value });
      $('newName').value = ''; $('newSlug').value = '';
      flash('המסך נוצר: ' + r.screen.name);
      await refresh(); openEditor(r.screen.id);
    } catch (e) { flash(e.message, false); }
  };
  $('saveBtn').onclick = saveEditor;
  $('closeBtn').onclick = () => { $('editor').hidden = true; editing = null; };
  $('deleteBtn').onclick = async () => {
    if (!editing || !confirm(`למחוק את המסך "${editing.name}"? אי אפשר לבטל.`)) return;
    try { await api('DELETE', 'screens/' + editing.id); $('editor').hidden = true; editing = null; flash('המסך נמחק.'); await refresh(); }
    catch (e) { flash(e.message, false); }
  };
  $('scope').onchange = loadContent;
  $('ctabs').onclick = (e) => { if (e.target.dataset.k) { ctab = e.target.dataset.k; showTab(); } };
  $('csave').onclick = saveContent;
  $('cclear').onclick = clearContent;

  if (KEY) start();
})();
</script>
</body>
</html>
